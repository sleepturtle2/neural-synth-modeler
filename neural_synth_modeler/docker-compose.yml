version: '3.8'

services:
  # BentoML Model Service
  neural-synth-modeler:
    build: .
    container_name: neural-synth-modeler
    ports:
      - "3000:3000"
    environment:
      BENTOML_CONFIG:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s 